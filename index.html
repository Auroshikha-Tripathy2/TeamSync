<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Team Sync</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <!-- Left Section -->
    <div class="left">
      <h2>Welcome to Team Sync</h2>
      <p>"Manage your profile, chat with teammates, and stay productive with your Kanban board."</p>
    </div>

    <!-- Right Section -->
    <div class="right">
      <h2>Login to Continue</h2>
      <form id="loginForm">
        <label for="username">Name</label>
        <input type="text" id="username" name="username" placeholder="Enter your name" aria-label="Full Name" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" aria-label="Password" required>

        <div class="remember">
          <label for="remember"><input type="radio" id="remember" name="remember">Remember Me</label>
          <a href="#" target="_blank">Forgot password?</a>
        </div>

        <div class="buttons">
          <button type="submit" class="btn-primary">Sign In</button>
          <button type="reset" class="btn-secondary">Reset</button>
        </div>
      </form>
    </div>

    <!-- Signup CTA -->
    <div class="signup-cta">
      New to TeamSync? <a href="signup.html">Create account</a>
    </div>
  </div>

  <script>
    // Simple redirect version — no authentication required
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (username && password) {
        // Save the username for personalized greeting
        localStorage.setItem("loggedInUser", username);
        // Redirect to dashboard
        window.location.href = "dashboard.html";
      } else {
        alert("Please fill in both fields before logging in.");
      }
    });
  </script>
</body>
</html>
