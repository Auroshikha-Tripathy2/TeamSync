<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Team Sync</title>
  <link rel="stylesheet" href="signup.css">

</head>
<body>
  <div class="container">
    <!-- Left Section -->
    <div class="left">
      <h2>Create an account on Team Sync</h2>
    </div>

    <!-- Right Section -->
    <div class="right">
      <h2>Create your account</h2>
      <form id="signupForm">
        <div>
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" placeholder="Enter your first name" aria-label="First Name" required>

            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" placeholder="Enter your last name" aria-label="Last Name" required>
        </div>

        <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" aria-label="Email" required>
        

        <div class="password">
            <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" aria-label="Password" required>
            <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" aria-label="Confirm Password" required>
        </div>

        <div class="buttons">
          <button type="submit" class="btn-primary">Sign Up</button>
          <button type="reset" class="btn-secondary">Reset</button>
        </div>
      </form>
    </div>
    <!-- Signup CTA -->
    <div class="signup-cta">
      Already in TeamSync? <a href="index.html">Sign in</a>
    </div>
  </div>

    const form = document.getElementById('signupForm');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        alert('Passwords do not match.');
        return;
      }

      const name = `${firstName} ${lastName}`.trim();

      try {
        const res = await fetch('http://localhost:5000/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await res.json();
        console.log(data);

        if (res.ok) {
          alert('Signup successful!');
          window.location.href = 'login.html'; // redirect to login
        } else {
          alert(data.msg || 'Signup failed');
        }
      } catch (err) {
        console.error(err);
        alert('An error occurred');
      }
    });


  </script>
