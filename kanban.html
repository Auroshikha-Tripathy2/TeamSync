<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board</title>
  <link rel="stylesheet" href="kanban.css" />
</head>
<body>

  <!-- Top Navbar -->
  <div class="navbar">
    <div class="logo">TeamSync</div>
    <header>Kanban</header>
    <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
  </div>

  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar-container">
      <div class="projects-section">
        <h3>Projects</h3>
        <div class="project-card" onclick="switchProject('Internet & Web Tech')">Internet & Web Tech</div>
        <div class="project-card" onclick="switchProject('Machine Learning')">Machine Learning</div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <h1 id="projectTitle">Kanban Board</h1>
      <div id="board" class="board-container"></div>
    </div>
  </div>

  <!-- Floating Add List Button -->
  <button class="add-list-btn-fixed" onclick="openDialog()">+ Add List</button>

  <!-- Add List Dialog -->
  <div id="dialog" class="dialog hidden">
    <div class="dialog-content">
      <h3>Add New List</h3>
      <input type="text" id="newListName" placeholder="Enter list name..." />
      <div class="dialog-buttons">
        <button onclick="createList()">Create</button>
        <button onclick="closeDialog()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // === Utility: Get project name from URL ===
    const params = new URLSearchParams(window.location.search);
    const projectName = params.get('project') || "Untitled Project";
    document.getElementById("projectTitle").textContent = projectName + " — Kanban Board";

    // === Back Button ===
    function goBack() {
      window.location.href = "dashboard.html";
    }

    // === Switch Project ===
    function switchProject(name) {
      window.location.href = `kanban.html?project=${encodeURIComponent(name)}`;
    }

    // === Base Data ===
    let lists = [
      { name: "Todo", color: "#1676b8", tickets: ["Setup repo", "Wireframe design"] },
      { name: "In Progress", color: "#4cbb74", tickets: ["Develop board UI"] },
      { name: "Done", color: "#f8c146", tickets: ["Project planning"] }
    ];

    // === Render Lists ===
    function renderLists() {
      const board = document.getElementById("board");
      board.innerHTML = "";

      lists.forEach((list, listIndex) => {
        const listDiv = document.createElement("div");
        listDiv.className = "list";
        listDiv.style.setProperty("--list-color", list.color);

        // Drag events
        listDiv.draggable = true;
        listDiv.addEventListener("dragstart", () => listDiv.classList.add("dragging"));
        listDiv.addEventListener("dragend", () => listDiv.classList.remove("dragging"));

        // Title Bar
        const titleBar = document.createElement("div");
        titleBar.className = "list-title";

        const title = document.createElement("span");
        title.textContent = list.name;

        const menuBtn = document.createElement("button");
        menuBtn.textContent = "⋮";
        menuBtn.onclick = (e) => toggleDropdown(e, listIndex);

        titleBar.appendChild(title);
        titleBar.appendChild(menuBtn);
        listDiv.appendChild(titleBar);

        // Dropdown Menu
        const dropdown = document.createElement("div");
        dropdown.className = "dropdown-menu";

        // Archive Button
        const archiveBtn = document.createElement("button");
        archiveBtn.textContent = "Archive List";
        archiveBtn.classList.add("archive-btn");
        archiveBtn.onclick = () => alert(`"${list.name}" archived!`);

        // Delete Button
        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete List";
        deleteBtn.classList.add("delete-btn");
        deleteBtn.onclick = () => {
          lists.splice(listIndex, 1);
          renderLists();
        };

        // Color Options
        const colorTitle = document.createElement("strong");
        colorTitle.textContent = "Change Color:";

        const colorRow = document.createElement("div");
        colorRow.className = "color-swatch-row";
        const colors = ["#1676b8", "#4cbb74", "#f8c146", "#ff7f76", "#9a6af6", "#16dabd", "#4397c7"];
        colors.forEach(color => {
          const swatch = document.createElement("div");
          swatch.className = "color-swatch";
          swatch.style.background = color;
          swatch.onclick = () => {
            list.color = color;
            renderLists();
          };
          colorRow.appendChild(swatch);
        });

        dropdown.append(archiveBtn, deleteBtn, colorTitle, colorRow);
        listDiv.appendChild(dropdown);

        // Tickets
        const ticketContainer = document.createElement("div");
        ticketContainer.className = "ticket-list";
        list.tickets.forEach(ticket => {
          const ticketDiv = document.createElement("div");
          ticketDiv.className = "ticket";
          ticketDiv.textContent = ticket;
          ticketContainer.appendChild(ticketDiv);
        });
        listDiv.appendChild(ticketContainer);

        // Add Ticket Footer
        const footer = document.createElement("div");
        footer.className = "list-footer";
        const input = document.createElement("input");
        input.className = "quick-add-input";
        input.placeholder = "Add new task...";
        const addBtn = document.createElement("button");
        addBtn.className = "add-ticket-btn";
        addBtn.textContent = "+";
        addBtn.onclick = () => {
          if (input.value.trim() !== "") {
            list.tickets.push(input.value.trim());
            input.value = "";
            renderLists();
          }
        };
        footer.append(input, addBtn);
        listDiv.appendChild(footer);

        board.appendChild(listDiv);
      });

      enableDrag();
    }

    // === Dropdown Toggle ===
    function toggleDropdown(event, index) {
      event.stopPropagation();
      document.querySelectorAll(".dropdown-menu").forEach(m => (m.classList.remove("show")));
      const menus = document.getElementsByClassName("dropdown-menu");
      const menu = menus[index];
      menu.classList.toggle("show");
    }

    document.addEventListener("click", () => {
      document.querySelectorAll(".dropdown-menu").forEach(m => (m.classList.remove("show")));
    });

    // === Dialog Functions ===
    function openDialog() {
      document.getElementById("dialog").classList.remove("hidden");
      document.getElementById("newListName").focus();
    }

    function closeDialog() {
      document.getElementById("dialog").classList.add("hidden");
      document.getElementById("newListName").value = "";
    }

    function createList() {
      const name = document.getElementById("newListName").value.trim();
      if (name) {
        lists.push({ name, color: "#1676b8", tickets: [] });
        closeDialog();
        renderLists();
      }
    }

    // === Drag Logic ===
    function enableDrag() {
      const board = document.getElementById("board");
      board.addEventListener("dragover", (e) => {
        e.preventDefault();
        const dragging = document.querySelector(".dragging");
        const afterElement = getDragAfterElement(board, e.clientX);
        if (!afterElement) board.appendChild(dragging);
        else board.insertBefore(dragging, afterElement);
      });
    }

    function getDragAfterElement(container, x) {
      const elements = [...container.querySelectorAll(".list:not(.dragging)")];
      return elements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = x - box.left - box.width / 2;
        if (offset < 0 && offset > closest.offset) return { offset, element: child };
        else return closest;
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    renderLists();
  </script>
</body>
</html>
